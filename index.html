<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5-Digit Kaprekar Routing Network</title>
    <style>
        html, body, #sigma-container {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #111827;
        }
        #controls {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
        }
        label {
            color: white;
    </style>
</head>
<body>
    <div id="controls">
        <label for="value">Enter a 5 digit combination</label>
        <input
            type="text"
            id="value"
            maxlength="5"
            inputmode="numeric"
        >
    </div>
    <div id="sigma-container"></div>
    <script type="module" src="/main.js"></script>
</body>
</html>
